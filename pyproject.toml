[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usbhawk"
dynamic = ["version"]                 # single source: usbhawk.__version__
description = "USBHawk: USB forensics for threat hunting and incident response - exfil session scoring, tamper and cleanup detection, detection-as-code (Sigma, Elastic, Sentinel) and a fleet device graph"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aakash Raman" }]
keywords = ["dfir", "forensics", "usb", "threat-hunting", "incident-response", "sigma", "detection-engineering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Environment :: Console",
]
dependencies = [
    "regipy>=4.0",
    "evtx>=0.8",
    "rich>=13",
    "pyyaml>=6",                         # detection rules (module #4) are YAML
    "tzdata; sys_platform == 'win32'",   # Windows has no system IANA tz database for zoneinfo
]

[project.urls]
Homepage = "https://github.com/aakashraman/usbhawk"
Documentation = "https://github.com/aakashraman/usbhawk/blob/main/docs/GETTING-STARTED.md"
Issues = "https://github.com/aakashraman/usbhawk/issues"
Changelog = "https://github.com/aakashraman/usbhawk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]
sigma = ["pySigma>=1.0", "pysigma-validators-sigmahq"]   # validate generated Sigma like SigmaHQ does
build = ["pyinstaller>=6"]                               # scripts/build_release.ps1: the standalone exe

[project.scripts]
usbhawk = "usbhawk.cli:main"

[tool.setuptools.dynamic]
version = { attr = "usbhawk.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
usbhawk = ["detections/rules/*.yml"]   # rule sources ship with the package so `usbhawk detections` works anywhere

[tool.pytest.ini_options]
testpaths = ["tests"]
